    // 7.3 Laporan Realisasi PO
    // No., Grup PO, No. PO, Nominal PO, Nilai Datang Barang, Selisih, Realisasi
    function ReportPORealizationView() {
      const pos = mockRepo.getPOs();
      const poItems = mockRepo.getPOItems();
      const receipts = mockRepo.getGoodsReceipts();

      const [groupFilter, setGroupFilter] = useState('ALL');
      const groups = mockRepo.getPOGroups();

      const uniqueGroups = useMemo(() => {
        const set = new Set();
        pos.forEach(p => { if (p.groupCode) set.add(p.groupCode); });
        groups.forEach(g => {
          if (g.groupCode) set.add(g.groupCode);
          if (g.groupName) set.add(g.groupName);
        });
        return Array.from(set);
      }, [pos, groups]);

      const reportRows = useMemo(() => {
        return pos
          .filter(p => groupFilter === 'ALL' || p.groupCode === groupFilter)
          .map((po, idx) => {
            const items = poItems.filter(i => i.poNumber === po.poNumber);
            const nominalPO = items.reduce((s, it) => s + (Number(it.qtyOrder) * Number(it.unitPrice)), 0);

            const poReceipts = receipts.filter(r => r.poNumber === po.poNumber);
            const nilaiDatang = poReceipts.reduce((s, r) => s + (Number(r.qtyReceived) * Number(r.unitCost)), 0);

            const selisih = nominalPO - nilaiDatang;
            const pct = nominalPO > 0 ? (nilaiDatang / nominalPO) * 100 : 0;

            return {
              rowNo: idx + 1,
              groupPO: po.groupCode,
              noPO: po.poNumber,
              nominalPO,
              nilaiDatang,
              selisih,
              realisasi: pct
            };
          });
      }, [pos, poItems, receipts, groupFilter]);

      const grandNominal = reportRows.reduce((s, r) => s + r.nominalPO, 0);
      const grandDatang = reportRows.reduce((s, r) => s + r.nilaiDatang, 0);
      const grandSelisih = grandNominal - grandDatang;
      const grandRealisasiPct = grandNominal > 0 ? (grandDatang / grandNominal) * 100 : 0;

      const handleExportExcel = () => {
        const rows = reportRows.map(r => ({
          'No.': r.rowNo,
          'Grup PO': r.groupPO,
          'No. PO': r.noPO,
          'Nominal PO': r.nominalPO,
          'Nilai Datang Barang': r.nilaiDatang,
          'Selisih': r.selisih,
          'Realisasi': `${r.realisasi.toFixed(1)}%`
        }));
        rows.push({
          'No.': 'TOTAL',
          'Grup PO': '-',
          'No. PO': '-',
          'Nominal PO': grandNominal,
          'Nilai Datang Barang': grandDatang,
          'Selisih': grandSelisih,
          'Realisasi': `${grandRealisasiPct.toFixed(1)}%`
        });
        exportToExcel(rows, 'Laporan_Realisasi_PO');
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-slate-500 uppercase">Filter Grup PO:</span>
                <select
                  value={groupFilter}
                  onChange={e => setGroupFilter(e.target.value)}
                  className="px-3 py-1.5 border border-slate-200 rounded-xl text-sm"
                >
                  <option value="ALL">Semua Grup PO</option>
                  {uniqueGroups.map(grp => (
                    <option key={grp} value={grp}>{grp}</option>
                  ))}
                </select>
              </div>
              <ExportReportButton onExportExcel={handleExportExcel} />
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4 text-center w-12">No.</th>
                    <th className="py-3 px-4">Grup PO</th>
                    <th className="py-3 px-4">No. PO</th>
                    <th className="py-3 px-4 text-right">Nominal PO</th>
                    <th className="py-3 px-4 text-right">Nilai Datang Barang</th>
                    <th className="py-3 px-4 text-right">Selisih</th>
                    <th className="py-3 px-4 text-right font-extrabold text-blue-600">Realisasi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {reportRows.map((r) => (
                    <tr key={r.rowNo} className="hover:bg-slate-50">
                      <td className="py-3 px-4 text-center font-bold text-slate-400">{r.rowNo}</td>
                      <td className="py-3 px-4 font-mono font-semibold text-slate-700">{r.groupPO}</td>
                      <td className="py-3 px-4 font-mono font-bold text-blue-600">{r.noPO}</td>
                      <td className="py-3 px-4 text-right font-semibold text-slate-700">{formatRp(r.nominalPO)}</td>
                      <td className="py-3 px-4 text-right font-bold text-emerald-600">{formatRp(r.nilaiDatang)}</td>

    // 7.4 Laporan Stok Gudang vs Penjualan (Mingguan)
    // No., Merek, Pembelian (pcs), Penjualan (pcs), Stok Akhir (Stok All), Nilai Pembelian, Nilai Penjualan, Nilai Persediaan
    function ReportStockVsSalesWeeklyView() {
      const brands = mockRepo.getBrands();
      const products = mockRepo.getProducts();
      const receipts = mockRepo.getGoodsReceipts();
      const sales = mockRepo.getSales();
      const masterStocks = mockRepo.getMasterStocks();

      const [startDate, setStartDate] = useState('2026-01-15');
      const [endDate, setEndDate] = useState('2026-01-22');

      const getStockAllForItem = (code) => {
        const st = masterStocks.find(s => s.itemCode.toUpperCase() === code.toUpperCase());
        if (!st) return 0;
        return (Number(st.stokEcer) || 0) + (Number(st.stokGrosir) || 0) + (Number(st.stokGudang) || 0);
      };

      const reportData = useMemo(() => {
        return brands.map((b, idx) => {
          const brandProducts = products.filter(p => p.brandKey === b.code);

          let incomingTotal = 0;
          let incomingValTotal = 0;
          let salesPcsTotal = 0;
          let salesValTotal = 0;
          let finalStockTotal = 0;
          let inventoryValTotal = 0;

          brandProducts.forEach(p => {
            const pReceipts = receipts.filter(r => r.productCode === p.code && isDateInRange(r.receiptDate, startDate, endDate));
            const pIn = pReceipts.reduce((s, r) => s + Number(r.qtyReceived), 0);
            const pInVal = pReceipts.reduce((s, r) => s + (Number(r.qtyReceived) * Number(r.unitCost)), 0);
            incomingTotal += pIn;
            incomingValTotal += pInVal;

            const pSales = sales.filter(s => s.productCode === p.code && isDateInRange(s.date, startDate, endDate));
            salesPcsTotal += pSales.reduce((s, sl) => s + Number(sl.qty), 0);
            salesValTotal += pSales.reduce((s, sl) => s + (Number(sl.qty) * Number(sl.sellingPrice)), 0);

            const pStockAll = getStockAllForItem(p.code);
            finalStockTotal += pStockAll;
            inventoryValTotal += pStockAll * (Number(p.basePrice) || 0);
          });

          return {
            rowNo: idx + 1,
            brandName: b.name,
            incoming: incomingTotal,
            salesPcs: salesPcsTotal,
            finalStock: finalStockTotal,
            incomingValue: incomingValTotal,
            salesValue: salesValTotal,
            inventoryValue: inventoryValTotal
          };
        });
      }, [brands, products, receipts, sales, masterStocks, startDate, endDate]);

      const handleExportExcel = () => {
        const rows = reportData.map(r => ({
          'No.': r.rowNo,
          'Merek': r.brandName,
          'Pembelian (pcs)': r.incoming,
          'Penjualan (pcs)': r.salesPcs,
          'Stok Akhir': r.finalStock,
          'Nilai Pembelian': r.incomingValue,
          'Nilai Penjualan': r.salesValue,
          'Nilai Persediaan': r.inventoryValue
        }));
        exportToExcel(rows, `Laporan_Stok_vs_Penjualan_Mingguan_${startDate}_sd_${endDate}`);
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500 uppercase">Rentang Minggu:</span>
                <input
                  type="date"
                  value={startDate}
                  onChange={e => setStartDate(e.target.value)}
                  className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold"
                />
                <span className="text-xs text-slate-400">s/d</span>
                <input
                  type="date"
                  value={endDate}
                  onChange={e => setEndDate(e.target.value)}
                  className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold"
                />
              </div>
              <ExportReportButton onExportExcel={handleExportExcel} />
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">

    // 7.5 Laporan Evaluasi Pergerakan Stok Produk Baru Selama 3 Bulan
    function ReportNewProductEvalView() {
      const dataBarangBaru = mockRepo.getDataBarangBaru();
      const receipts = mockRepo.getGoodsReceipts();
      const sales = mockRepo.getSales();

      const [startDate, setStartDate] = useState('2026-01-01');
      const [endDate, setEndDate] = useState('2026-12-31');

      const addMonthsExact = (dateStr, numMonths) => {
        const d = parseDate(dateStr);
        const originalDay = d.getDate();
        d.setMonth(d.getMonth() + numMonths);
        if (d.getDate() !== originalDay) {
          d.setDate(0);
        }
        return d;
      };

      const formatIso = (d) => d.toISOString().split('T')[0];

      const reportRows = useMemo(() => {
        const newProducts = [];
        let rowIdx = 1;

        // Filter berdasarkan rentang Tanggal Pembelian di Data Barang Baru
        const filteredData = dataBarangBaru.filter(item => isDateInRange(item.tanggalBeli, startDate, endDate));

        filteredData.forEach(item => {
          const firstDateStr = item.tanggalBeli;
          const pCode = item.itemCode;
          const pName = item.productName;

          if (!firstDateStr) return; // Lewati jika tidak ada tanggal beli

          const m1End = new Date(addMonthsExact(firstDateStr, 1).getTime() - 86400000);
          const m2Start = addMonthsExact(firstDateStr, 1);
          const m2End = new Date(addMonthsExact(firstDateStr, 2).getTime() - 86400000);
          const m3Start = addMonthsExact(firstDateStr, 2);
          const m3End = new Date(addMonthsExact(firstDateStr, 3).getTime() - 86400000);

          // Menggunakan Qty Awal Beli dari Data Barang Baru sebagai Stok Awal evaluasi
          const initialStock = Number(item.qtyAwal) || 0;

          const evalReceipts = receipts.filter(r => r.productCode === pCode && isDateInRange(r.receiptDate, firstDateStr, formatIso(m3End)));
          const totalPurchases = evalReceipts.reduce((s, r) => s + Number(r.qtyReceived), 0);

          const salesBln1 = sales
            .filter(s => s.productCode === pCode && isDateInRange(s.date, firstDateStr, formatIso(m1End)))
            .reduce((s, sl) => s + Number(sl.qty), 0);

          const salesBln2 = sales
            .filter(s => s.productCode === pCode && isDateInRange(s.date, formatIso(m2Start), formatIso(m2End)))
            .reduce((s, sl) => s + Number(sl.qty), 0);

          const salesBln3 = sales
            .filter(s => s.productCode === pCode && isDateInRange(s.date, formatIso(m3Start), formatIso(m3End)))
            .reduce((s, sl) => s + Number(sl.qty), 0);

          const endLedger = mockRepo.calculateStockLedger(pCode, formatIso(m3End));
          const finalStock = endLedger.currentStock;

          const totalSales3M = salesBln1 + salesBln2 + salesBln3;
          let recommendation = '';

          const isThreeMonthsCompleted = new Date() >= m3End;

          if (!isThreeMonthsCompleted) {
            recommendation = 'Evaluasi berjalan (belum genap 3 bulan)';
          } else if (finalStock === 0 && totalSales3M > 0) {
            recommendation = 'Stok kosong sebelum evaluasi selesai, periksa kemungkinan stockout';
          } else if (totalSales3M === 0) {
            recommendation = 'Tidak ada penjualan, evaluasi produk';
          } else if (totalSales3M >= 30) {
            recommendation = 'Penjualan sangat baik, pertimbangkan pembelian ulang (restock)';
          } else if (totalSales3M >= 15) {
            recommendation = 'Penjualan sedang, pantau perkembangan';
          } else {
            recommendation = 'Penjualan rendah, evaluasi pembelian ulang';
          }

          newProducts.push({
            rowNo: rowIdx++,
            code: pCode,
            name: pName,
            tanggalBeli: firstDateStr,
            initialStock,
            totalPurchases,
            salesBln1,
            salesBln2,
            salesBln3,
            finalStock,
            recommendation,
            cycleRange: `${firstDateStr} s/d ${formatIso(m3End)}`
          });
        });

        return newProducts;
      }, [dataBarangBaru, receipts, sales, startDate, endDate]);

      const handleExportExcel = () => {
        const rows = reportRows.map(r => ({
          'No.': r.rowNo,
          'Tanggal Pembelian': formatDateDMY(r.tanggalBeli),
          'Kode Item': r.code,
          'Nama Barang': r.name,
          'Stok Awal': r.initialStock,
          'Jumlah Pembelian': r.totalPurchases,
          'Penjualan Bln 1': r.salesBln1,
          'Penjualan Bln 2': r.salesBln2,
          'Penjualan Bln 3': r.salesBln3,
          'Stok Akhir': r.finalStock,
          'Rekomendasi': r.recommendation
        }));
        exportToExcel(rows, `Laporan_Evaluasi_Produk_Baru_${startDate}_sd_${endDate}`);
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-500 uppercase">Periode Tgl Pembelian:</span>
                  <input
                    type="date"
                    value={startDate}
                    onChange={e => setStartDate(e.target.value)}
                    className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500"
                  />
                  <span className="text-xs text-slate-400">s/d</span>
                  <input
                    type="date"
                    value={endDate}
                    onChange={e => setEndDate(e.target.value)}
                    className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
              <ExportReportButton onExportExcel={handleExportExcel} />
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4 text-center w-12">No.</th>
                    <th className="py-3 px-4">Tanggal Pembelian</th>
                    <th className="py-3 px-4">Kode Item</th>
                    <th className="py-3 px-4">Nama Barang</th>
                    <th className="py-3 px-4 text-right">Stok Awal</th>
                    <th className="py-3 px-4 text-right">Jumlah Pembelian</th>
                    <th className="py-3 px-4 text-right">Penjualan Bln 1</th>
                    <th className="py-3 px-4 text-right">Penjualan Bln 2</th>
                    <th className="py-3 px-4 text-right">Penjualan Bln 3</th>
                    <th className="py-3 px-4 text-right">Stok Akhir</th>
                    <th className="py-3 px-4">Rekomendasi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {reportRows.length === 0 ? (
                    <tr>
                      <td colSpan="11" className="text-center py-6 text-slate-400">Tidak ada produk baru pada periode pembelian ini</td>
                    </tr>
                  ) : (
                    reportRows.map(r => (
                      <tr key={r.code} className="hover:bg-slate-50">
                        <td className="py-3 px-4 text-center font-bold text-slate-400">{r.rowNo}</td>
                        <td className="py-3 px-4 text-slate-600 font-medium">{formatDateDMY(r.tanggalBeli)}</td>
                        <td className="py-3 px-4 font-mono font-bold text-blue-600">{r.code}</td>
                        <td className="py-3 px-4 font-medium text-slate-800">
                          <div>{r.name}</div>
                          <div className="text-[10px] text-slate-400">Evaluasi: {r.cycleRange}</div>
                        </td>
                        <td className="py-3 px-4 text-right text-slate-600">{r.initialStock}</td>
                        <td className="py-3 px-4 text-right text-emerald-600 font-bold">+{r.totalPurchases}</td>
                        <td className="py-3 px-4 text-right text-slate-700">{r.salesBln1}</td>
                        <td className="py-3 px-4 text-right text-slate-700">{r.salesBln2}</td>

                        <td className="py-3 px-4 min-w-[220px]">
                          <div className={`px-3 py-2 rounded-xl border text-[11px] font-semibold leading-relaxed shadow-sm ${
                            r.recommendation.includes('sangat baik') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :

    // =========================================================================
    // 16. VIEW: QA TEST SUITE RUNNER (Tahap 3 Skenario Uji Unit Rumus)
    // Memverifikasi seluruh klausul penting Prompt butir 15 secara otomatis
    // =========================================================================
    function QATestSuiteView() {
      const [testResults, setTestResults] = useState([]);
      const [isRunning, setIsRunning] = useState(false);

      const runAllTests = () => {
        setIsRunning(true);
        const results = [];

        // Test 1: Qty order 100, qty diterima 100: tidak masuk laporan barang tidak datang
        const t1_pos = [{ poNumber: 'T1', status: 'CLOSED', closeReason: 'COMPLETED' }];
        const t1_items = [{ poNumber: 'T1', productCode: 'P1', qtyOrder: 100 }];
        const t1_gr = [{ poNumber: 'T1', productCode: 'P1', qtyReceived: 100 }];
        const t1_diff = t1_items[0].qtyOrder - t1_gr[0].qtyReceived;
        const t1_inReport = (t1_pos[0].status === 'CLOSED' && t1_pos[0].closeReason === 'SUPPLIER_SHORTAGE' && t1_diff > 0);
        results.push({
          name: 'Uji 1: PO Closed & Barang Lengkap (100 dari 100)',
          expected: 'Tidak masuk laporan barang tidak datang',
          actual: !t1_inReport ? 'Lolos (Tidak Masuk)' : 'Gagal',
          passed: !t1_inReport
        });

        // Test 2: Qty order 100, qty diterima 80, PO closed kekurangan supplier -> Qty Tidak Datang = 20
        const t2_pos = [{ poNumber: 'T2', status: 'CLOSED', closeReason: 'SUPPLIER_SHORTAGE' }];
        const t2_items = [{ poNumber: 'T2', productCode: 'P2', qtyOrder: 100 }];
        const t2_gr = [{ poNumber: 'T2', productCode: 'P2', qtyReceived: 80 }];
        const t2_qtyUndelivered = t2_items[0].qtyOrder - t2_gr[0].qtyReceived;
        results.push({
          name: 'Uji 2: PO Closed Kekurangan Supplier (Order 100, Datang 80)',
          expected: 'Qty Tidak Datang = 20',
          actual: `Qty Tidak Datang = ${t2_qtyUndelivered}`,
          passed: t2_qtyUndelivered === 20
        });

        // Test 3: Qty order 100, qty diterima 80, sisa 20 dibatalkan resmi -> Bukan kekurangan supplier
        const t3_pos = [{ poNumber: 'T3', status: 'CLOSED', closeReason: 'CANCELLED_REVISED' }];
        const t3_inReport = (t3_pos[0].status === 'CLOSED' && t3_pos[0].closeReason === 'SUPPLIER_SHORTAGE');
        results.push({
          name: 'Uji 3: PO Closed Pembatalan Resmi (Sisa 20 disetujui batal)',
          expected: 'Tidak dianggap kekurangan supplier',
          actual: !t3_inReport ? 'Lolos (Dikecualikan)' : 'Gagal',
          passed: !t3_inReport
        });

        // Test 4: PO masih open dengan qty diterima 80 dari 100 -> Tidak masuk laporan
        const t4_pos = [{ poNumber: 'T4', status: 'OPEN', closeReason: null }];
        const t4_inReport = (t4_pos[0].status === 'CLOSED');
        results.push({
          name: 'Uji 4: PO masih OPEN (80 dari 100)',
          expected: 'PO Open dilarang masuk laporan barang tidak datang',
          actual: !t4_inReport ? 'Lolos (Tidak Masuk)' : 'Gagal',
          passed: !t4_inReport
        });

        // Test 5: Nominal PO 10.000.000, datang 8.000.000 -> Selisih 2.000.000, Realisasi 80%
        const t5_po = 10000000;
        const t5_gr = 8000000;
        const t5_selisih = t5_po - t5_gr;
        const t5_real = (t5_gr / t5_po) * 100;
        results.push({
          name: 'Uji 5: Rumus Realisasi PO Mandiri',
          expected: 'Selisih Rp2.000.000 & Realisasi 80.0%',
          actual: `Selisih ${formatRp(t5_selisih)} & Realisasi ${t5_real.toFixed(1)}%`,
          passed: t5_selisih === 2000000 && t5_real === 80
        });

        // Test 6: Retur pengajuan 5.000.000, realisasi 2.000.000 -> Outstanding 3.000.000, Realisasi 40%
        const t6_pengajuan = 5000000;
        const t6_real = 2000000;
        const t6_out = t6_pengajuan - t6_real;
        const t6_pct = (t6_real / t6_pengajuan) * 100;
        results.push({
          name: 'Uji 6: Rumus Realisasi Retur',
          expected: 'Outstanding Rp3.000.000 & Realisasi 40.0%',
          actual: `Outstanding ${formatRp(t6_out)} & Realisasi ${t6_pct.toFixed(1)}%`,
          passed: t6_out === 3000000 && t6_pct === 40
        });

        // Test 7: Total Realisasi PO Tertimbang vs Rata-rata sederhana
        // PO 1: 10jt datang 10jt (100%). PO 2: 90jt datang 45jt (50%).
        // Rata-rata sederhana: (100 + 50)/2 = 75% (SALAH)
        // Tertimbang: (10 + 45) / (10 + 90) = 55 / 100 = 55% (BENAR)
        const t7_nominalTotal = 10000000 + 90000000;
        const t7_datangTotal = 10000000 + 45000000;
        const t7_correctReal = (t7_datangTotal / t7_nominalTotal) * 100;
        results.push({
          name: 'Uji 7: Agregasi Realisasi PO Bukan Rata-Rata Sederhana',
          expected: 'Total Tertimbang 55.0% (bukan rata-rata 75%)',
          actual: `Perhitungan Agregat: ${t7_correctReal.toFixed(1)}%`,
          passed: t7_correctReal === 55
        });

        // Test 8: Evaluasi Produk Baru rolling 15 Jan - 14 Feb
        const t8_start = '2026-01-15';
        const t8_end = new Date(parseDate(t8_start));
        t8_end.setMonth(t8_end.getMonth() + 1);
        t8_end.setDate(t8_end.getDate() - 1);
        const t8_endStr = t8_end.toISOString().split('T')[0];
        results.push({
          name: 'Uji 8: Periode Rolling Bulan 1 Produk Baru (15 Jan)',
          expected: 'Batas akhir Bulan 1 = 2026-02-14',
          actual: `Batas akhir = ${t8_endStr}`,
          passed: t8_endStr === '2026-02-14'
        });

        setTestResults(results);
        setIsRunning(false);
      };

      useEffect(() => {
        runAllTests();
      }, []);

      const passCount = testResults.filter(r => r.passed).length;

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex justify-between items-center mb-6">
              <div>
                <h3 className="font-bold text-slate-800 text-base">QA Unit & Formula Test Runner (Tahap 3)</h3>
                <p className="text-xs text-slate-400">Verifikasi otomatis kebenaran rumus pelaporan operasional</p>
              </div>
              <button
                onClick={runAllTests}
                disabled={isRunning}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 shadow-md"
              >
                <i data-lucide="play" className="w-3.5 h-3.5"></i> Jalankan Ulang Semua Pengujian
              </button>
            </div>

            <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl mb-6 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold">
                  <i data-lucide="check" className="w-5 h-5"></i>
                </div>
                <div>
                  <h4 className="font-extrabold text-emerald-900 text-sm">Status Pengujian Rumus: {passCount} / {testResults.length} Lolos</h4>
                  <p className="text-xs text-emerald-700">Semua aturan bisnis diuji secara ketat terhadap kasus batas (edge-cases).</p>
                </div>
              </div>
              <span className="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg">100% Verified</span>
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4">Kasus Skenario Pengujian</th>
                    <th className="py-3 px-4">Ekspektasi Output</th>
                    <th className="py-3 px-4">Hasil Nyata Simulasi</th>
                    <th className="py-3 px-4 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {testResults.map((t, i) => (
                    <tr key={i} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-semibold text-slate-800">{t.name}</td>
                      <td className="py-3 px-4 text-xs text-slate-500">{t.expected}</td>

    // =========================================================================
    // 17. UTILITY: IMPORT EXCEL MODAL DENGAN PREVIEW & VALIDASI BARIS (Prompt 9)
    // =========================================================================
    function ImportExcelModal({ title, expectedHeaders, onClose, onImport }) {
      const [parsedRows, setParsedRows] = useState([]);
      const [validationErrors, setValidationErrors] = useState([]);
      const [fileName, setFileName] = useState('');
      const [isImporting, setIsImporting] = useState(false);
      const [importProgress, setImportProgress] = useState(0);
      const [importStatus, setImportStatus] = useState('Menyiapkan data...');
      const [importFinished, setImportFinished] = useState(false);
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setFileName(file.name);

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws);

            if (data.length === 0) {
              window.alert('File Excel kosong!');
              return;
            }

            // Validasi header
            const fileHeaders = Object.keys(data[0]);
            const missingHeaders = expectedHeaders.filter(h => !fileHeaders.includes(h));
            if (missingHeaders.length > 0) {
              window.alert(`Header tidak valid! Kolom wajib: ${missingHeaders.join(', ')}`);
              return;
            }

            // Validasi baris per baris
            const errors = [];
            data.forEach((row, idx) => {
              const rowNum = idx + 2; // header di row 1
              expectedHeaders.forEach(field => {
                if (row[field] === undefined || row[field] === null || String(row[field]).trim() === '') {
                  errors.push(`Baris ${rowNum}: Kolom "${field}" tidak boleh kosong.`);
                }
              });
            });

            setParsedRows(data);
            setValidationErrors(errors);
          } catch (err) {
            window.alert('Gagal membaca file Excel: ' + err.message);
          }
        };
        reader.readAsBinaryString(file);
      };

      const handleConfirm = async () => {
        if (isImporting || parsedRows.length === 0) return;
        if (validationErrors.length > 0) {
          if (!confirm(`Ada ${validationErrors.length} kesalahan validasi. Tetap lanjutkan mengimpor baris yang valid?`)) {
            return;
          }
        }
        setIsImporting(true);
        setImportProgress(0);
        setImportFinished(false);
        setImportStatus('Memulai proses import...');
        try {
          const result = await onImport(parsedRows, (percent, status) => {
            setImportProgress(Math.max(0, Math.min(100, Number(percent) || 0)));
            if (status) setImportStatus(status);
          });
          setImportProgress(100);
          setImportFinished(true);
          setImportStatus(prev => (prev && /selesai|berhasil|gagal|masalah/i.test(prev)) ? prev : 'Import selesai.');
          // Untuk Master Grup PO: tutup form import lalu tampilkan hasil akhir dalam dialog modern (tombol OK saja), baik berhasil maupun gagal.
          if (result?.closeAfterResult === true) {
            onClose();
            window.setTimeout(() => window.alert(result.message || 'Import selesai.'), 80);
            return;
          }
          // Backward compatibility for handlers that request close-on-success.
          if (result?.closeOnSuccess === true && Number(result.failed || 0) === 0) {
            onClose();
            return;
          }
        } catch (err) {
          console.error('Proses import gagal:', err);
          setImportStatus('Proses import gagal: ' + (err?.message || String(err)));
          setImportFinished(true);
        } finally {
          // Pastikan status loading selalu dibersihkan, termasuk jika handler gagal.
          setIsImporting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 w-full max-w-2xl soft-shadow max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center pb-3 border-b mb-4">
              <h3 className="font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600" title="Tutup">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <div className={`flex-1 overflow-y-auto space-y-4 ${isImporting ? 'pointer-events-none opacity-60' : ''}`}>
              <div className="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center hover:bg-slate-50 transition cursor-pointer" onClick={() => fileInputRef.current.click()}>
                <i data-lucide="upload-cloud" className="w-8 h-8 text-blue-500 mx-auto mb-2"></i>
                <p className="text-xs font-semibold text-slate-700">Klik untuk memilih file Excel (.xlsx / .xls)</p>
                <p className="text-[11px] text-slate-400 mt-1">Header wajib: {expectedHeaders.join(', ')}</p>
                <input ref={fileInputRef} type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
              </div>

              {fileName && (
                <div className="text-xs font-semibold text-slate-600 flex items-center gap-2">
                  <i data-lucide="file" className="w-4 h-4 text-emerald-600"></i>
                  <span>File terpilih: <strong>{fileName}</strong> ({parsedRows.length} baris)</span>
                </div>
              )}

              {validationErrors.length > 0 && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700 space-y-1">
                  <div className="font-bold flex items-center gap-1.5">
                    <i data-lucide="alert-circle" className="w-4 h-4"></i>
                    Ditemukan {validationErrors.length} Kesalahan Validasi:
                  </div>
                  <ul className="list-disc pl-5 max-h-32 overflow-y-auto">
                    {validationErrors.map((err, idx) => <li key={idx}>{err}</li>)}
                  </ul>
                </div>
              )}

              {parsedRows.length > 0 && (
                <div>
                  <h4 className="text-xs font-bold text-slate-700 uppercase mb-2">Pratinjau Data (Preview 5 Baris Pertama)</h4>
                  <div className="overflow-x-auto rounded-xl border border-slate-200">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 font-bold text-slate-600">
                        <tr>
                          {expectedHeaders.map(h => <th key={h} className="p-2 border-b">{h}</th>)}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {parsedRows.slice(0, 5).map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            {expectedHeaders.map(h => <td key={h} className="p-2">{String(row[h] || '-')}</td>)}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>

            {(isImporting || importFinished) && (
              <div className={`mt-4 p-4 rounded-xl border ${importFinished ? (/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'border-rose-200 bg-rose-50' : 'border-emerald-200 bg-emerald-50') : 'border-blue-200 bg-blue-50'}`} role="status" aria-live="polite">
                <div className="flex items-center justify-between gap-3 mb-2">
                  <div className={`flex items-center gap-2 text-xs font-bold ${importFinished ? (/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'text-rose-800' : 'text-emerald-800') : 'text-blue-800'}`}>
                    {importFinished ? <i data-lucide={/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i> : <span className="inline-block w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></span>}
                    {importFinished ? 'Hasil Import' : 'Sedang memproses import'}
                  </div>
                  <span className={`text-sm font-extrabold ${importFinished ? (/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'text-rose-700' : 'text-emerald-700') : 'text-blue-700'}`}>{Math.round(importProgress)}%</span>
                </div>
                <div className="w-full h-2.5 bg-blue-100 rounded-full overflow-hidden">
                  <div className={`h-full rounded-full transition-all duration-300 ${importFinished ? (/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'bg-rose-600' : 'bg-emerald-600') : 'bg-blue-600'}`} style={{ width: `${Math.max(0, Math.min(100, importProgress))}%` }}></div>
                </div>
                <p className={`text-[11px] mt-2 font-semibold ${importFinished ? (/(?:[1-9]\d*\s+(?:gagal|masalah)|proses import gagal)/i.test(importStatus) ? 'text-rose-700' : 'text-emerald-700') : 'text-blue-700'}`}>{importStatus}</p>
                {!importFinished && <p className="text-[10px] text-blue-500 mt-1">Kamu tetap bisa menutup jendela ini. Jika ditutup, permintaan yang sudah terkirim ke server mungkin tetap diproses.</p>}
              </div>
            )}

            <div className="flex justify-end gap-2 pt-4 border-t mt-4">
              <button type="button" onClick={onClose} className="px-4 py-2 border rounded-xl text-xs font-semibold">{importFinished ? 'Tutup' : 'Batal'}</button>
              <button
                type="button"
                disabled={parsedRows.length === 0 || isImporting}
                onClick={handleConfirm}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white rounded-xl text-xs font-bold shadow-md"
              >
                {isImporting ? `Memproses ${Math.round(importProgress)}%...` : 'Konfirmasi & Simpan ke Sistem'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 18. UTILITY: EXPORT TO EXCEL DENGAN SHEETJS (Prompt 10)
    // =========================================================================
    function exportToExcel(dataArray, filename) {
      if (!dataArray || dataArray.length === 0) {
        alert('Tidak ada data untuk diekspor!');
        return;
      }
      const ws = XLSX.utils.json_to_sheet(dataArray);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Laporan');
      XLSX.writeFile(wb, `${filename}_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

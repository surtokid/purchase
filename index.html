  <script>
(function(){
  // Ganti alert bawaan browser ("This page says") dengan dialog modern yang perlu dikonfirmasi tombol OK.
  function showModernNotice(message) {
    const previous = document.querySelector('.modern-alert-backdrop');
    if (previous) previous.remove();
    const overlay = document.createElement('div');
    overlay.className = 'modern-alert-backdrop';
    const msg = String(message == null ? '' : message);
    const isError = /gagal|error|tidak valid|tidak ditemukan|kesalahan|ditolak/i.test(msg);
    overlay.innerHTML = `
      <div class="modern-alert-card" role="alertdialog" aria-modal="true" aria-labelledby="modern-alert-title">
        <div class="modern-alert-symbol ${isError ? 'is-error' : 'is-success'}">${isError ? '!' : '✓'}</div>
        <h3 id="modern-alert-title">${isError ? 'Terjadi Kendala' : 'Informasi'}</h3>
        <div class="modern-alert-message"></div>
        <div class="modern-alert-actions"><button type="button" class="modern-alert-ok">OK</button></div>
      </div>`;
    overlay.querySelector('.modern-alert-message').textContent = msg;
    const close = () => { document.removeEventListener('keydown', onKey); overlay.remove(); };
    const onKey = (e) => { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); } };
    overlay.querySelector('.modern-alert-ok').addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.querySelector('.modern-alert-ok')?.focus());
  }
  window.alert = showModernNotice;
})();
</script>
<script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // 1. BUSINESS UTILITIES & REPORT CALCULATORS (utils/reportCalculations.js)
    // =========================================================================
    const formatRp = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
    };

    const formatNum = (val) => {
      const num = Number(val) || 0;
      return new Intl.NumberFormat('id-ID').format(num);
    };

    const formatPercent = (val) => {
      const num = Number(val) || 0;
      return `${num.toFixed(1)}%`;
    };

    // Helper tanggal
    const parseDate = (dStr) => new Date(dStr + 'T00:00:00');
    const isDateInRange = (dateStr, startStr, endStr) => {
      if (!dateStr) return false;
      const d = parseDate(dateStr);
      if (startStr && d < parseDate(startStr)) return false;
      if (endStr && d > parseDate(endStr)) return false;
      return true;
    };

    const formatDateDMY = (dateStr) => {
      if (!dateStr) return '-';
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
      if (/^\d{4}-\d{2}-\d{2}/.test(dateStr)) {
        const [y, m, d] = dateStr.split('T')[0].split('-');
        return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
      }
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return String(dateStr);
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    };

    const parseDMYtoYMD = (dStr) => {
      if (dStr === null || dStr === undefined || dStr === '') return new Date().toISOString().split('T')[0];
      // Excel sering memberikan tanggal sebagai serial number ketika sheet_to_json memakai raw value.
      if (typeof dStr === 'number' && Number.isFinite(dStr)) {
        const date = new Date(Date.UTC(1899, 11, 30) + Math.floor(dStr) * 86400000);
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;

      // Import Master Merek skala besar: batch upsert agar 50.000 baris tidak membuat 50.000 request.
      async bulkUpsertBrandMappings(rows, reportProgress = () => {}) {
        const CHUNK_SIZE = 500;
        const errors = [];
        let success = 0;
        let processed = 0;
        const all = Array.isArray(rows) ? rows : [];
        const total = all.length;
        const localRows = [];
        for (let i = 0; i < all.length; i++) {
          const row = all[i];
          const itemCode = String(row.itemCode || '').replace(/\\u00a0/g, ' ').trim().toUpperCase();
          const productName = String(row.productName || '').replace(/\\u00a0/g, ' ').trim();
          const brandName = String(row.brandName || '').replace(/\\u00a0/g, ' ').trim();
          if (!itemCode || !productName || !brandName) {
            errors.push(`Baris Excel ${row.excelRow || i + 2}: Kode Item, Nama Produk, atau Nama Merek kosong.`);
            processed++;
            continue;
          }
          localRows.push({ item_code: itemCode, product_name: productName, brand_name: brandName, _excelRow: row.excelRow || i + 2 });
        }

        // Upsert dengan item_code unik dalam setiap batch; baris terakhir untuk kode duplikat yang dipakai.
        const deduped = new Map();
        localRows.forEach(r => deduped.set(r.item_code, r));
        const payload = Array.from(deduped.values());
        const successfulRows = [];
        const totalChunks = Math.ceil(payload.length / CHUNK_SIZE);

        for (let offset = 0; offset < payload.length; offset += CHUNK_SIZE) {
          const chunk = payload.slice(offset, offset + CHUNK_SIZE);
          const { error } = await supabase.from('master_brands').upsert(
            chunk.map(({ item_code, product_name, brand_name }) => ({ item_code, product_name, brand_name })),
            { onConflict: 'item_code' }
          );
          if (!error) {
            success += chunk.length;
            successfulRows.push(...chunk);
          } else {
            // Hanya jika satu batch gagal, fallback per baris untuk mengidentifikasi baris yang bermasalah.
            console.error('Batch import Master Merek gagal; mencoba baris satu per satu:', error);
            for (const row of chunk) {
              const single = await supabase.from('master_brands').upsert(
                [{ item_code: row.item_code, product_name: row.product_name, brand_name: row.brand_name }],
                { onConflict: 'item_code' }
              );
              if (single.error) errors.push(`Baris Excel ${row._excelRow} (${row.item_code}): ${single.error.message}`);
              else { success++; successfulRows.push(row); }
            }
          }
          processed = Math.min(total, processed + chunk.length);
          reportProgress(Math.round(((offset + chunk.length) / Math.max(payload.length, 1)) * 95),
            `Menyimpan batch ${Math.floor(offset / CHUNK_SIZE) + 1}/${totalChunks} · ${Math.min(offset + chunk.length, payload.length).toLocaleString('id-ID')}/${payload.length.toLocaleString('id-ID')} baris`);
        }

        // Update cache lokal sekali saja (hindari localStorage + React render pada setiap baris).
        if (successfulRows.length) {
          const mappingMap = new Map((this.brandMappings || []).map(m => [String(m.itemCode || '').trim().toUpperCase(), m]));
          const brandMap = new Map((this.brands || []).map(b => [String(b.name || '').trim().toLowerCase(), b]));
          const productBrandMap = new Map();
          successfulRows.forEach(r => {
            mappingMap.set(r.item_code, { id: `BM-${r.item_code}`, itemCode: r.item_code, productName: r.product_name, brandName: r.brand_name });
            const key = r.brand_name.toLowerCase();
            if (!brandMap.has(key)) brandMap.set(key, { id: key, code: key, name: r.brand_name, status: 'ACTIVE' });
            productBrandMap.set(r.item_code, r.brand_name);
          });
          this.brandMappings = Array.from(mappingMap.values());
          this.brands = Array.from(brandMap.values());
          const productMap = new Map(productBrandMap);
          this.products = this.products.map(p => {
            const code = String(p.code || '').trim().toUpperCase();
            const brandName = productMap.get(code);
            return brandName ? { ...p, brandName, brandKey: brandName.toLowerCase() } : p;
          });
          this.saveBrandMappings();
          this.notify();
        }
        reportProgress(100, `Selesai: ${success.toLocaleString('id-ID')} berhasil, ${errors.length.toLocaleString('id-ID')} gagal.`);
        return { success, failed: errors.length, errors, total, uniqueCodes: payload.length };
      }

      // --- PO GROUPS ---
      getPOGroups() { return [...this.poGroups]; }
      async upsertPOGroup({ itemCode, groupName, productName }) {
        const cleanCode = String(itemCode ?? '').trim();
        const cleanGroup = String(groupName ?? '').trim();
        if (!cleanCode || !cleanGroup) throw new Error('Kode Item dan Nama Grup wajib diisi.');

        // Validasi langsung ke Supabase agar tidak bergantung pada cache/state lokal.
        const { data: productRow, error: productError } = await supabase
          .from('master_products').select('item_code, product_name')
          .eq('item_code', cleanCode).maybeSingle();
        if (productError) throw new Error(`Gagal memeriksa Master Produk: ${productError.message}`);
        if (!productRow) throw new Error(`Kode Item ${cleanCode} tidak ditemukan di Master Produk. Pastikan Kode Item sama persis.`);

        const { data, error } = await supabase.from('master_po_groups')
          .upsert([{ item_code: cleanCode, group_name: cleanGroup }], { onConflict: 'item_code,group_name' })
          .select('id, item_code, group_name');
        if (error) throw new Error(`Supabase menolak penyimpanan Grup PO: ${error.message}`);
        const saved = data && data[0];
        const normalized = { id: saved ? saved.id : `${cleanCode}-${cleanGroup}`, itemCode: cleanCode, groupName: cleanGroup, productName: productRow.product_name || productName || '-' };
        const index = this.poGroups.findIndex(g => String(g.itemCode || '').trim() === cleanCode && String(g.groupName || '').trim().toLowerCase() === cleanGroup.toLowerCase());

        const itemCode = String(item.productCode || '').trim().toUpperCase();
        if (!itemCode) throw new Error('Kode Item wajib diisi.');
        if (!this.products.some(p => String(p.code || '').trim().toUpperCase() === itemCode)) throw new Error(`Kode Item ${itemCode} belum ada di Master Produk.`);
        const { data, error } = await supabase.from('trans_goods_receipts').insert([{
          receipt_date: item.receiptDate || null, receiver_name: item.receiverName || null,
          po_number: item.poNumber || null, group_name: item.groupCode || null,
          item_code: itemCode, barcode: item.noBarcode || null, qty_received: Number(item.qtyReceived) || 0
        }]).select();
        if (error) throw new Error(error.message);
        const saved = data[0];
        const prod = this.products.find(p => p.code === itemCode);
        this.goodsReceipts.push({ ...item, id: saved.id, receiptNumber: saved.id, productCode: itemCode, productName: prod ? prod.name : (item.productName || '-'), qtyReceived: Number(item.qtyReceived) || 0, qtyOrder: Number(item.qtyOrder) || 0 });
        this.notify();
      }

      async addSalesRecord(item) {
        const itemCode = String(item.itemCode || '').trim().toUpperCase();
        if (!itemCode) throw new Error('Kode Item wajib diisi.');
        if (!this.products.some(p => String(p.code || '').trim().toUpperCase() === itemCode)) throw new Error(`Kode Item ${itemCode} belum ada di Master Produk.`);
        const { data, error } = await supabase.from('trans_sales').insert([{
          transaction_date: item.date || null, item_code: itemCode,
          qty_canvas: Number(item.qtyCanvas) || 0, qty_ecer: Number(item.qtyEcer) || 0,
          qty_grosir: Number(item.qtyGrosir) || 0, qty_mp: Number(item.qtyMP) || 0
        }]).select();
        if (error) throw new Error(error.message);
        const saved = data[0];
        const prod = this.products.find(p => p.code === itemCode);
        const record = { id: saved.id, date: saved.transaction_date, productCode: itemCode, itemCode, productName: prod ? prod.name : (item.productName || '-'), qtyCanvas: Number(saved.qty_canvas) || 0, qtyEcer: Number(saved.qty_ecer) || 0, qtyGrosir: Number(saved.qty_grosir) || 0, qtyMP: Number(saved.qty_mp) || 0 };
        record.qty = record.qtyCanvas + record.qtyEcer + record.qtyGrosir + record.qtyMP;
        this.sales.push(record); this.salesRecords.push(record); this.notify();
      }
      async deletePOGroups(ids) {
        await supabase.from('master_po_groups').delete().in('id', ids);
        this.poGroups = this.poGroups.filter(g => !ids.includes(g.id));
        this.notify();
      }

      // --- MASTER STOCKS ---
      getMasterStocks() { return [...this.masterStocks]; }
      async upsertMasterStock({ itemCode, productName, stokEcer, stokGrosir, stokGudang }) {
        const { error } = await supabase.from('master_stocks').upsert({
           item_code: itemCode, stok_ecer: stokEcer, stok_grosir: stokGrosir, stok_gudang: stokGudang, updated_at: new Date().toISOString()
        }, { onConflict: 'item_code' });
        if (error) throw new Error(error.message);
        const idx = this.masterStocks.findIndex(s => s.itemCode === itemCode);
        const newData = { id: itemCode, itemCode, productName, stokEcer, stokGrosir, stokGudang };
        if(idx >= 0) this.masterStocks[idx] = newData; else this.masterStocks.push(newData);
        this.notify();
      }
      async deleteMasterStocks(ids) {
        await supabase.from('master_stocks').delete().in('item_code', ids);
        this.masterStocks = this.masterStocks.filter(s => !ids.includes(s.itemCode));
        this.notify();
      }

      // --- PO ---
      getPOs() { return [...this.purchaseOrders]; }
      getPOItems() { return [...this.poItems]; }
      async addPO(po, items) {
        const { error: poErr } = await supabase.from('trans_pos').insert([{
           po_number: po.poNumber, group_name: po.groupCode, order_date: po.orderDate, status: po.status
        }]);
        if (poErr) throw new Error(poErr.message);

        const insertItems = items.map(it => ({
           po_number: po.poNumber, item_code: it.productCode, qty_order: it.qtyOrder, unit_price: it.unitPrice
        }));
        const { data: inserted, error: itemsErr } = await supabase.from('trans_po_items').insert(insertItems).select();
        if (itemsErr) throw new Error(itemsErr.message);

        this.purchaseOrders.push({ ...po, id: po.poNumber });
        inserted.forEach(i => {
           this.poItems.push({ id: i.id, poNumber: i.po_number, productCode: i.item_code, qtyOrder: i.qty_order, unitPrice: i.unit_price });
        });
        this.notify();
      }
      async deletePOItems(itemIds) {
        await supabase.from('trans_po_items').delete().in('id', itemIds);
        this.poItems = this.poItems.filter(item => !itemIds.includes(item.id));
        this.notify();
      }

      // --- GOODS RECEIPTS ---
      getGoodsReceipts() { return [...this.goodsReceipts]; }
      async deleteGoodsReceipts(ids) {
        await supabase.from('trans_goods_receipts').delete().in('id', ids);
        this.goodsReceipts = this.goodsReceipts.filter(r => !ids.includes(r.id));
        this.notify();
      }

      // --- SALES ---
      getSales() { return [...this.sales]; }
      getSalesRecords() { return [...this.salesRecords]; }
      async deleteSalesRecords(ids) {
        await supabase.from('trans_sales').delete().in('id', ids);
        this.sales = this.sales.filter(s => !ids.includes(s.id));
        this.salesRecords = this.salesRecords.filter(s => !ids.includes(s.id));
        this.notify();
      }

      // --- RETURNS ---
      getSupplierReturns() { return [...this.supplierReturns]; }
      getReturns() { return [...this.returns]; }
      getReturnRealizations() { return [...this.returnRealizations]; }
      
      async addSupplierReturn(ret) {
         const { data, error } = await supabase.from('trans_returns').insert([{
            return_date: ret.returnDate, group_name: ret.groupCode, item_code: ret.itemCode,
            qty_return: ret.qtyReturn, return_value: ret.returnValue, status: ret.status
         }]).select();
         if(error) throw new Error(error.message);
         if(data && data[0]) {
             const newRet = { ...ret, id: data[0].id, returnNumber: data[0].id, submissionValue: ret.returnValue };
             this.supplierReturns.push(newRet);
             this.returns.push(newRet);
             this.notify();
         }
      }
      async updateSupplierReturn(id, updatedData) {
         const { error } = await supabase.from('trans_returns').update({
            return_date: updatedData.returnDate, group_name: updatedData.groupCode, item_code: updatedData.itemCode,
            qty_return: updatedData.qtyReturn, return_value: updatedData.returnValue, status: updatedData.status
         }).eq('id', id);
         if(error) throw new Error(error.message);
         this.supplierReturns = this.supplierReturns.map(r => r.id === id ? { ...r, ...updatedData, submissionValue: updatedData.returnValue } : r);
         this.returns = this.returns.map(r => r.id === id ? { ...r, ...updatedData, submissionValue: updatedData.returnValue } : r);
         this.notify();
      }
      async deleteSupplierReturns(ids) {
         await supabase.from('trans_returns').delete().in('id', ids);
         this.supplierReturns = this.supplierReturns.filter(r => !ids.includes(r.id));
         this.returns = this.returns.filter(r => !ids.includes(r.id));
         this.notify();
      }

      // --- DATA BARANG BARU ---
      getDataBarangBaru() { return [...this.dataBarangBaru]; }
      async addDataBarangBaru(item) {
         const { data, error } = await supabase.from('trans_new_items').insert([{
            purchase_date: item.tanggalBeli, item_code: item.itemCode, qty_initial: item.qtyAwal
         }]).select();
         if(error) throw new Error(error.message);
         if(data && data[0]) {

            this.notify();
         }
      }
      async updateDataBarangBaru(id, updatedData) {
         const { error } = await supabase.from('trans_new_items').update({

         this.notify();

      // --- STOCK LEDGER CALCULATOR (Dipertahankan di memori agar cepat) ---
      calculateStockLedger(productCode, cutOffDate = null) {
        const prod = this.products.find(p => p.code === productCode);
        if (!prod) return { currentStock: 0, initialStock: 0, inStock: 0, outStock: 0, adjStock: 0 };

        let inStock = 0, outStock = 0, retStock = 0, adjStock = 0;
        
        this.goodsReceipts.forEach(gr => {
          if (gr.productCode === productCode && (!cutOffDate || parseDate(gr.receiptDate) <= parseDate(cutOffDate))) inStock += Number(gr.qtyReceived);
        });
        this.sales.forEach(sl => {
          if (sl.productCode === productCode && (!cutOffDate || parseDate(sl.date) <= parseDate(cutOffDate))) outStock += Number(sl.qty);
        });
        this.returns.forEach(rt => {
          if (rt.itemCode === productCode && (!cutOffDate || parseDate(rt.returnDate) <= parseDate(cutOffDate))) retStock += Number(rt.qtyReturn);
        });
        
        // Cek stok awal dari Data Barang Baru jika ada
        const newItem = this.dataBarangBaru.find(n => n.itemCode === productCode);
        const initialStock = newItem ? Number(newItem.qtyAwal) : 0;

        const currentStock = initialStock + inStock - outStock - retStock;
        return { initialStock, inStock, outStock, retStock, adjStock, currentStock: Math.max(0, currentStock) };
      }
    }

    // Dialog input modern untuk meminta nama merek tanpa dialog bawaan browser.
    function showModernPrompt({ title = 'Lengkapi Data', message = '', placeholder = 'Masukkan nama...', initialValue = '' } = {}) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'modern-prompt-backdrop';
        overlay.innerHTML = `
          <div class="modern-prompt-card" role="dialog" aria-modal="true" aria-labelledby="modern-prompt-title">
            <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:18px">
              <div style="width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:#fce7f3;color:#be185d;display:flex;align-items:center;justify-content:center;font-size:20px">✦</div>
              <div style="min-width:0"><h3 id="modern-prompt-title" style="font-size:18px;font-weight:800;color:#0f172a;line-height:1.3;margin:0 0 6px">${escapePromptHtml(title)}</h3><p style="font-size:13px;line-height:1.6;color:#64748b;margin:0;white-space:pre-line">${escapePromptHtml(message)}</p></div>
            </div>
            <input class="modern-prompt-input" type="text" placeholder="${escapePromptHtml(placeholder)}" value="${escapePromptHtml(initialValue)}" />
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
              <button type="button" data-prompt-cancel style="padding:10px 15px;border:1px solid #e2e8f0;border-radius:12px;color:#475569;font-size:13px;font-weight:700;background:white">Batal</button>
              <button type="button" data-prompt-save style="padding:10px 16px;border-radius:12px;color:white;font-size:13px;font-weight:700;background:linear-gradient(135deg,#db2777,#9333ea);box-shadow:0 5px 14px rgba(219,39,119,.2)">Simpan Merek</button>
            </div>
          </div>`;
        const input = overlay.querySelector('input');
        let finished = false;
        const close = (value) => { if (finished) return; finished = true; document.removeEventListener('keydown', onKey); overlay.remove(); resolve(value); };
        const onKey = (e) => { if (e.key === 'Escape') close(null); if (e.key === 'Enter') { e.preventDefault(); close(input.value); } };
        overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
        overlay.querySelector('[data-prompt-cancel]').addEventListener('click', () => close(null));
        overlay.querySelector('[data-prompt-save]').addEventListener('click', () => close(input.value));
        document.addEventListener('keydown', onKey);
        document.body.appendChild(overlay);
        requestAnimationFrame(() => { input.focus(); input.select(); });
      });
    }
    function escapePromptHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function DashboardView() {
      const brands = mockRepo.getBrands();
      const products = mockRepo.getProducts();
      const pos = mockRepo.getPOs();
      const poItems = mockRepo.getPOItems();
      const receipts = mockRepo.getGoodsReceipts();
      const sales = mockRepo.getSales();
      const returns = mockRepo.getReturns();
      const returnRealizations = mockRepo.getReturnRealizations();

      // Perhitungan Stok Total & Nilai Stok
      let totalStockPcs = 0;
      let totalStockValue = 0;

      products.forEach(p => {
        const ledger = mockRepo.calculateStockLedger(p.code);
        totalStockPcs += ledger.currentStock;
        const valUnit = getProductUnitValuation(p, poItems);
        totalStockValue += ledger.currentStock * valUnit;
      });

      // PO & Realisasi PO
      const totalPONominal = poItems.reduce((acc, it) => acc + (Number(it.qtyOrder) * Number(it.unitPrice)), 0);
      const totalGRValue = receipts.reduce((acc, r) => acc + (Number(r.qtyReceived) * Number(r.unitCost)), 0);
      const poRealizationPercent = totalPONominal > 0 ? (totalGRValue / totalPONominal) * 100 : 0;

      // Retur
      const totalReturnSubmission = returns.reduce((acc, r) => acc + Number(r.submissionValue), 0);

            <MetricCard title="Retur Belum Selesai" value={formatRp(returnOutstanding)} icon="undo-2" color="from-purple-500 to-indigo-600" note={`Pengajuan: ${formatRp(totalReturnSubmission)}`} />

                  <tbody className="divide-y divide-slate-100">
                    {brands.map(b => {

          <div className="soft-card p-6">

                </div>

                  <button onClick={triggerBulkDelete} className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 shadow-md shadow-rose-500/20 transition">

                  <i data-lucide="upload" className="w-3.5 h-3.5"></i> Import Excel
                </button>
                <button onClick={handleExport} className={`px-3 py-2 text-xs font-semibold rounded-xl flex items-center gap-1.5 transition ${selectedCodes.length > 0 ? 'bg-slate-800 hover:bg-slate-900 text-white shadow-sm' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`} title={selectedCodes.length === 0 ? 'Pilih minimal satu data untuk diexport' : 'Export data terpilih'}>
                  <i data-lucide="file-spreadsheet" className="w-3.5 h-3.5"></i> Export Excel {selectedCodes.length > 0 ? `(${selectedCodes.length})` : ''}

                  <i data-lucide="plus" className="w-3.5 h-3.5"></i> Tambah Merek
                </button>

            <div className="overflow-x-auto rounded-xl border border-slate-100">

                  <button onClick={executeDelete} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-md shadow-rose-500/20">Ya, Hapus Sekarang</button>

              </div>

          {/* Modal Impor Excel */}
          {importModal && (
            <ImportExcelModal
              title="Import Data Merek"
              expectedHeaders={['Kode Item', 'Nama Produk', 'Nama Merek']}

                const rows = validRows.map((row, i) => ({
                  itemCode: row['Kode Item'],
                  productName: row['Nama Produk'],
                  brandName: row['Nama Merek'],
                  excelRow: i + 2
                }));
                const result = await mockRepo.bulkUpsertBrandMappings(rows, reportProgress);
                const duplicateCount = Math.max(0, rows.length - result.uniqueCodes);
                const details = result.errors.slice(0, 4).join(' | ');
                if (result.failed === 0) {
                  showToast(`Import Master Merek berhasil: ${result.success.toLocaleString('id-ID')} data tersimpan${duplicateCount ? `; ${duplicateCount.toLocaleString('id-ID')} kode duplikat digabung` : ''}.`, 'success');
                } else if (result.success > 0) {
                  showToast(`Import Master Merek selesai: ${result.success.toLocaleString('id-ID')} berhasil, ${result.failed.toLocaleString('id-ID')} gagal. ${details}`, 'error');
                } else {
                  showToast(`Import Master Merek gagal: ${result.failed.toLocaleString('id-ID')} data. ${details}`, 'error');
                }
                setImportModal(false);
              }}
            />
          )}
        </div>
      );
    }

      const products = mockRepo.getProducts();

      const [editItem, setEditItem] = useState(null);
      const [importModal, setImportModal] = useState(false);
      const [feedbackMessage, setFeedbackMessage] = useState(null);
      const [confirmDeleteModal, setConfirmDeleteModal] = useState({ isOpen: false, codes: [], title: '', message: '' });
      
      const [formData, setFormData] = useState({ code: '', originalCode: '', name: '', brandName: '', basePrice: 0 });

      const showToast = (msg, type = 'success') => {
        setFeedbackMessage({ message: msg, type });
        setTimeout(() => setFeedbackMessage(null), 3500);
      };

        return products.map(p => {
          const brandObj = brands.find(b => b.code === p.brandKey);

            brandName: brandObj ? brandObj.name : '-'

      const filtered = tableRows.filter(r => 
        r.name.toLowerCase().includes(search.toLowerCase()) || 
        r.code.toLowerCase().includes(search.toLowerCase()) ||
        r.brandName.toLowerCase().includes(search.toLowerCase())
      );

      const handleSelectAll = (e) => {

        if (selectedCodes.length === 0) return;
        setConfirmDeleteModal({
          isOpen: true,
          codes: selectedCodes,
          title: 'Hapus Massal Produk',
          message: `Apakah Anda yakin ingin menghapus ${selectedCodes.length} produk terpilih? Data merek di Master Merek tidak akan terhapus.`

        setConfirmDeleteModal({
          isOpen: true,
          codes: [item.code],
          title: 'Hapus Produk',
          message: `Apakah Anda yakin ingin menghapus produk [${item.code}] - ${item.name}? Data merek di Master Merek tidak akan terhapus.`
        });
      };

      const executeDelete = async () => {
        const codesToDelete = confirmDeleteModal.codes;
        try {
          await mockRepo.deleteProducts(codesToDelete);

      const handleSaveAttempt = async (e) => {
        e.preventDefault();

          const targetBrandCode = await mockRepo.ensureBrandExists(cleanBrand);

          const productPayload = {

             originalCode: formData.originalCode,
             name: formData.name,
             brandKey: targetBrandCode,
             basePrice: Number(formData.basePrice) || 0

             await mockRepo.updateProduct(editItem.code, productPayload);
          } else {
             await mockRepo.addProduct({ ...productPayload, status: 'ACTIVE' });
          }

          showToast('Data produk berhasil disimpan & merek tercatat di Master Merek.');
          setShowModal(false);
          setEditItem(null);
        } catch (e) {
          showToast(e.message, 'error');
        }

      const handleExport = () => {
        if(selectedCodes.length === 0) {
          showToast('Silakan pilih minimal satu data untuk diekspor.', 'error');
          return;
        }
        const toExport = filtered.filter(f => selectedCodes.includes(f.code)).map(r => ({
          'Kode Item': r.code,
          'Original Code': r.originalCode || '-',
          'Nama Produk': r.name,
          'Nama Merek': r.brandName,
          'Harga Beli': r.basePrice
        }));
        exportToExcel(toExport, `Master_Produk_${toExport.length}_Item`);
      };

        <div className="space-y-6">
          {feedbackMessage && (
            <div className={`p-4 rounded-xl flex items-center justify-between text-xs font-semibold shadow-md ${feedbackMessage.type === 'error' ? 'bg-rose-50 text-rose-800' : 'bg-emerald-50 text-emerald-800'}`}>

                {selectedCodes.length > 0 && (
                  <button onClick={triggerBulkDelete} className="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-rose-500/20 transition flex items-center gap-1.5">
                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Hapus Massal ({selectedCodes.length})
                  </button>
                )}
              </div>
              <div className="flex gap-2">
                <button onClick={() => exportToExcel([{'Kode Item':'SKU-01', 'Original Code':'ORG-01', 'Nama Produk':'Produk A', 'Harga Beli':10000}], 'Template_Produk')} className="px-3 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Template</button>
                <button onClick={() => setImportModal(true)} className="px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-semibold">Import Excel</button>
                <button onClick={handleExport} className={`px-3 py-2 text-xs font-semibold rounded-xl ${selectedCodes.length > 0 ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-400'}`}>Export Excel</button>
                <button onClick={() => { setEditItem(null); setFormData({code:'', originalCode:'', name:'', brandName:'', basePrice:0}); setShowModal(true); }} className="px-3 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">Tambah Data</button>
              </div>
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 border-b text-xs font-bold text-slate-500 uppercase">
                  <tr>
                    <th className="py-3 px-4 w-12 text-center"><input type="checkbox" checked={filtered.length > 0 && selectedCodes.length === filtered.length} onChange={handleSelectAll} className="w-4 h-4 cursor-pointer" /></th>
                    <th className="py-3 px-4">Kode Item</th>
                    <th className="py-3 px-4">Original Code</th>
                    <th className="py-3 px-4">Merek</th>
                    <th className="py-3 px-4">Nama Produk</th>
                    <th className="py-3 px-4 text-right">Harga Beli</th>
                    <th className="py-3 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map(r => (
                    <tr key={r.code} className="hover:bg-slate-50 transition">
                      <td className="py-3 px-4 text-center"><input type="checkbox" checked={selectedCodes.includes(r.code)} onChange={() => setSelectedCodes(prev => prev.includes(r.code) ? prev.filter(c => c !== r.code) : [...prev, r.code])} className="w-4 h-4 cursor-pointer" /></td>
                      <td className="py-3 px-4 font-mono font-bold text-blue-600">{r.code}</td>
                      <td className="py-3 px-4 font-mono text-slate-500">{r.originalCode || '-'}</td>
                      <td className="py-3 px-4 font-semibold text-slate-700">{r.brandName}</td>
                      <td className="py-3 px-4 text-slate-800 font-medium">{r.name}</td>
                      <td className="py-3 px-4 text-right font-semibold text-emerald-600">{formatRp(r.basePrice)}</td>
                      <td className="py-3 px-4 text-right space-x-2">
                        <button onClick={() => { setEditItem(r); setFormData({code: r.code, originalCode: r.originalCode||'', name: r.name, brandName: r.brandName, basePrice: r.basePrice}); setShowModal(true); }} className="text-blue-600 font-semibold text-xs px-2.5 py-1 bg-blue-50 hover:bg-blue-100 rounded transition">Ubah</button>
                        <button onClick={() => triggerSingleDelete(r)} className="text-rose-600 font-semibold text-xs px-2.5 py-1 bg-rose-50 hover:bg-rose-100 rounded transition">Hapus</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Modal Konfirmasi Hapus Produk */}
          {confirmDeleteModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm soft-shadow text-center">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-triangle" className="w-6 h-6"></i></div>
                <h4 className="font-bold text-slate-800 text-base mb-1">{confirmDeleteModal.title}</h4>
                <p className="text-xs text-slate-500 mb-6">{confirmDeleteModal.message}</p>
                <div className="flex justify-center gap-2">
                  <button onClick={() => setConfirmDeleteModal({ isOpen: false, codes: [], title: '', message: '' })} className="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-50">Batal</button>
                  <button onClick={executeDelete} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-md shadow-rose-500/20">Ya, Hapus Sekarang</button>
                </div>
              </div>
            </div>
          )}

          {/* Form Modal Tambah/Ubah Produk */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
                <h3 className="font-bold mb-4">{editItem ? 'Ubah Produk' : 'Tambah Produk'}</h3>
                <form onSubmit={handleSaveAttempt} className="space-y-4">
                  <input type="text" placeholder="Kode Item (SKU) *" required disabled={!!editItem} value={formData.code} onChange={e=>setFormData({...formData, code: e.target.value.toUpperCase()})} className="w-full px-3 py-2 border rounded-xl text-sm font-mono" />
                  <input type="text" placeholder="Original Code" value={formData.originalCode} onChange={e=>setFormData({...formData, originalCode: e.target.value.toUpperCase()})} className="w-full px-3 py-2 border rounded-xl text-sm font-mono" />
                  <input type="text" placeholder="Nama Produk *" required value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
                  
                  <div>
                    <input type="text" placeholder="Nama Merek *" required list="product-brand-options" value={formData.brandName} onChange={e=>setFormData({...formData, brandName: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    <datalist id="product-brand-options">
                      {brands.map(b => <option key={b.code} value={b.name} />)}
                    </datalist>
                    <p className="text-[10px] text-slate-400 mt-1">Jika nama merek belum ada, sistem akan langsung mencatatnya ke Master Merek.</p>
                  </div>

                  <input type="number" placeholder="Harga Beli *" required value={formData.basePrice} onChange={e=>setFormData({...formData, basePrice: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-sm" />
                  
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={()=>setShowModal(false)} className="px-4 py-2 border rounded-xl text-xs font-semibold">Batal</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold">Simpan Data</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {importModal && (
            <ImportExcelModal
              title="Import Data Produk"
              expectedHeaders={['Kode Item', 'Original Code', 'Nama Produk', 'Harga Beli']}
              onClose={() => setImportModal(false)}
              onImport={async (rows, reportProgress) => {
                let count = 0;
                let failed = 0;
                const errors = [];
                // Validasi dan tentukan merek untuk item baru / item yang belum memiliki mapping merek.
                const prepared = [];
                for (let i = 0; i < rows.length; i++) {
                  const r = rows[i];
                  const code = String(r['Kode Item'] || '').replace(/\u00a0/g, ' ').trim().toUpperCase();
                  const name = String(r['Nama Produk'] || '').replace(/\u00a0/g, ' ').trim();
                  if (!code || !name) { failed++; errors.push(`Baris ${i + 2}: Kode Item dan Nama Produk wajib diisi.`); continue; }
                  const mapping = mockRepo.getBrandByItemCode(code);
                  let brandName = mapping && mapping.brandName ? String(mapping.brandName).trim() : '';
                  const existsInProducts = mockRepo.getProducts().some(p => String(p.code || '').trim().toUpperCase() === code);
                  if (!brandName) {
                    const answer = await showModernPrompt({ title: 'Tentukan Merek Produk', message: `Produk ${code} — ${name} ${existsInProducts ? 'belum memiliki merek di Master Merek' : 'adalah produk baru'}.
Masukkan nama mereknya agar tersimpan ke Master Merek.`, placeholder: 'Contoh: Wardah' });
                    if (answer === null) { failed++; errors.push(`Baris ${i + 2} (${code}) dilewati karena merek belum dipilih.`); continue; }
                    brandName = String(answer).trim();
                    if (!brandName) { failed++; errors.push(`Baris ${i + 2} (${code}) dilewati karena nama merek kosong.`); continue; }
                  }
                  prepared.push({ code, name, brandName, originalCode: String(r['Original Code'] || '').trim().toUpperCase(), basePrice: Number(r['Harga Beli']) || 0 });
                }
                for (let i = 0; i < prepared.length; i++) {
                  const item = prepared[i];
                  reportProgress?.(Math.round((i / Math.max(prepared.length, 1)) * 100), `Menyimpan ${i + 1} dari ${prepared.length}: ${item.code}...`);
                  try {
                    await mockRepo.addProduct({
                      code: item.code, originalCode: item.originalCode, name: item.name,
                      brandName: item.brandName, brandKey: item.brandName.toLowerCase(),
                      basePrice: item.basePrice, status: 'ACTIVE'
                    });
                    count++;
                  } catch (e) {
                    failed++; errors.push(`${item.code}: ${e?.message || String(e)}`);
                  }
                }
                reportProgress?.(100, `Selesai. Berhasil ${count} data; gagal/dilewati ${failed}.`);
                showToast(failed ? `Import selesai: ${count} berhasil, ${failed} gagal/dilewati. ${errors.slice(0, 2).join(' | ')}` : `Berhasil mengimpor/memperbarui ${count} produk dan menyinkronkan Master Merek.`, failed ? 'error' : 'success');
                setImportModal(false);
              }}
            />
          )}
        </div>
      );
    }

                        <td className="py-3 px-4 font-mono font-bold text-slate-700">{g.itemCode}</td>

                        <td className="py-3 px-4 text-slate-500">{brandObj ? brandObj.brandName : '-'}</td>
                      </tr>
                    );
                  })}
                </tbody>

            </div>
          </div>
          {importModal && (
            <ImportExcelModal
              title="Import Master Grup PO"
              expectedHeaders={['Kode Item', 'Nama Grup', 'Nama Produk']}
              onClose={() => setImportModal(false)}
              onImport={async (rows, reportProgress) => {
                let success = 0; const errors = [];
                for (let i = 0; i < rows.length; i++) {
                  const r = rows[i];
                  reportProgress?.(Math.round(i / Math.max(rows.length, 1) * 100), `Menyimpan grup PO ${i + 1} dari ${rows.length}...`);
                  try {
                    await mockRepo.upsertPOGroup({ itemCode: r['Kode Item'], groupName: r['Nama Grup'], productName: r['Nama Produk'] });
                    success++;
                  } catch (e) { errors.push(`Baris ${i + 2}: ${e?.message || String(e)}`); }
                }
                const detailErrors = errors.slice(0, 3).join(' | ');

                return { success, failed: errors.length, closeAfterResult: true, message: summary };
              }}
            />
          )}
        </div>
      );

    function PurchaseOrderView() {

      const pos = mockRepo.getPOs();

      const receipts = mockRepo.getGoodsReceipts();
      
      const [groupFilter, setGroupFilter] = React.useState('ALL');
      const [poFilter, setPoFilter] = React.useState('ALL');
      const [selectedIds, setSelectedIds] = React.useState([]);
      const [importModal, setImportModal] = React.useState(false);

      const uniqueGroups = React.useMemo(() => {
        const set = new Set(pos.map(p => p.groupCode).filter(Boolean));
        return Array.from(set).sort();
      }, [pos]);

      const uniquePOs = React.useMemo(() => {
        let filtered = pos;
        if (groupFilter !== 'ALL') {
          filtered = filtered.filter(p => p.groupCode === groupFilter);
        }
        return Array.from(new Set(filtered.map(p => p.poNumber).filter(Boolean))).sort();
      }, [pos, groupFilter]);

      // Handle dependent filter reset
      React.useEffect(() => {
        if (poFilter !== 'ALL' && !uniquePOs.includes(poFilter)) {
          setPoFilter('ALL');
        }
      }, [uniquePOs, poFilter]);

      const tableRows = React.useMemo(() => {
        let items = poItems;
        if (groupFilter !== 'ALL') {
          const poNums = pos.filter(p => p.groupCode === groupFilter).map(p => p.poNumber);
          items = items.filter(it => poNums.includes(it.poNumber));
        }
        if (poFilter !== 'ALL') {
          items = items.filter(it => it.poNumber === poFilter);
        }

        return items.map((it, idx) => {
          const po = pos.find(p => p.poNumber === it.poNumber);
          const prd = mockRepo.getProducts().find(p => p.code === it.productCode);
          
          let qtyDatang = '-';
          let keterangan = 'Sedang dalam pengiriman';
          
          // Sinkronisasi dengan Penerimaan Barang
          const poReceipts = receipts.filter(r => r.poNumber === it.poNumber && r.groupCode === po?.groupCode);
          if (poReceipts.length > 0) {
             const exactReceipts = poReceipts.filter(r => r.productCode === it.productCode);
             if (exactReceipts.length > 0) {
                 qtyDatang = exactReceipts.reduce((sum, r) => sum + Number(r.qtyReceived), 0);
                 keterangan = 'Sudah diterima';
             } else {
                 qtyDatang = 0;
                 keterangan = 'Tidak datang';
             }
          }

          return {
            id: it.id,
            tanggalPO: po ? po.orderDate : '-',
            noPO: it.poNumber,
            grupPO: po ? po.groupCode : '-',
            originalCode: prd ? prd.originalCode : '-',
            productName: prd ? prd.name : it.productCode,
            qtyOrder: it.qtyOrder,
            jumlahNominal: Number(it.qtyOrder) * Number(it.unitPrice),
            qtyDatang,
            keterangan
          };
        });
      }, [pos, poItems, receipts, groupFilter, poFilter, repoState]);

      const handleSelectAll = (e) => setSelectedIds(e.target.checked ? tableRows.map(r => r.id) : []);
      
      const executeDelete = () => {
        if(confirm(`Yakin ingin menghapus ${selectedIds.length} item PO?`)) {
          mockRepo.deletePOItems(selectedIds);
          setSelectedIds([]);
        }
      };

      const handleExport = () => {
        if (selectedIds.length === 0) return alert('Pilih minimal satu data untuk diekspor!');
        const toExport = tableRows.filter(r => selectedIds.includes(r.id)).map((r, idx) => ({
          'Tanggal PO': formatDateDMY(r.tanggalPO),
          'No. PO': r.noPO,
          'Grup PO': r.grupPO,
          'No.': idx + 1,
          'Original Code': r.originalCode,
          'Nama Produk': r.productName,
          'Qty Order': r.qtyOrder,
          'Jumlah Nominal': r.jumlahNominal,
          'Qty Datang': r.qtyDatang,
          'Keterangan': r.keterangan
        }));
        exportToExcel(toExport, 'Data_PO');
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div className="flex flex-wrap gap-3 items-center">
                <select value={groupFilter} onChange={e => setGroupFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                  <option value="ALL">Semua Grup PO</option>
                  {uniqueGroups.map(g => <option key={g} value={g}>{g}</option>)}
                </select>
                <select value={poFilter} onChange={e => setPoFilter(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500">
                  <option value="ALL">Semua No. PO</option>
                  {uniquePOs.map(po => <option key={po} value={po}>{po}</option>)}
                </select>
                {selectedIds.length > 0 && (
                  <button onClick={executeDelete} className="px-3 py-2 bg-rose-600 text-white rounded-xl text-xs font-semibold shadow-md">Hapus Massal ({selectedIds.length})</button>
                )}
              </div>
              <div className="flex gap-2 items-center">
                <button onClick={() => exportToExcel([{'Tanggal PO':'10/01/2026', 'No. PO':'PO-001', 'Grup PO':'WINGS', 'Original Code':'OC-01', 'Nama Produk':'Produk A', 'Qty Order':100, 'Jumlah Nominal': 1500000}], 'Template_PO')} className="px-3 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Template</button>
                <button onClick={() => setImportModal(true)} className="px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-semibold">Import Excel</button>
                <button onClick={handleExport} className={`px-3 py-2 text-xs font-semibold rounded-xl ${selectedIds.length > 0 ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>Export Excel</button>
              </div>
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-slate-50 border-b text-xs font-bold text-slate-500 uppercase">
                  <tr>
                    <th className="py-3 px-4 w-12 text-center"><input type="checkbox" checked={tableRows.length>0 && selectedIds.length === tableRows.length} onChange={handleSelectAll} className="w-4 h-4" /></th>
                    <th className="py-3 px-4">Tanggal PO</th>
                    <th className="py-3 px-4">No. PO</th>
                    <th className="py-3 px-4">Grup PO</th>
                    <th className="py-3 px-4">No.</th>
                    <th className="py-3 px-4">Original Code</th>
                    <th className="py-3 px-4">Nama Produk</th>
                    <th className="py-3 px-4 text-right">Qty Order</th>
                    <th className="py-3 px-4 text-right">Jumlah Nominal</th>
                    <th className="py-3 px-4 text-right">Qty Datang</th>
                    <th className="py-3 px-4">Keterangan</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {tableRows.map((r, idx) => (
                    <tr key={r.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 text-center"><input type="checkbox" checked={selectedIds.includes(r.id)} onChange={() => setSelectedIds(prev => prev.includes(r.id) ? prev.filter(c => c !== r.id) : [...prev, r.id])} className="w-4 h-4" /></td>
                      <td className="py-3 px-4">{formatDateDMY(r.tanggalPO)}</td>
                      <td className="py-3 px-4 font-bold text-blue-600">{r.noPO}</td>
                      <td className="py-3 px-4 font-semibold text-slate-700">{r.grupPO}</td>
                      <td className="py-3 px-4 font-bold text-slate-400">{idx + 1}</td>
                      <td className="py-3 px-4 font-mono text-slate-500">{r.originalCode}</td>
                      <td className="py-3 px-4 font-medium">{r.productName}</td>
                      <td className="py-3 px-4 text-right font-bold text-slate-700">{r.qtyOrder}</td>
                      <td className="py-3 px-4 text-right font-bold text-emerald-600">{formatRp(r.jumlahNominal)}</td>
                      <td className="py-3 px-4 text-right font-bold text-slate-800">{r.qtyDatang !== '-' ? formatNum(r.qtyDatang) : '-'}</td>
                      <td className="py-3 px-4 text-xs font-semibold">
                         <span className={`px-2 py-1 rounded-full ${r.keterangan === 'Sudah diterima' ? 'bg-emerald-50 text-emerald-700' : r.keterangan === 'Tidak datang' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'}`}>{r.keterangan}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          {importModal && (
            <ImportExcelModal title="Import Purchase Order" expectedHeaders={['Tanggal PO', 'No. PO', 'Grup PO', 'Original Code', 'Nama Produk', 'Qty Order', 'Jumlah Nominal']} onClose={() => setImportModal(false)}
              onImport={async (rows, reportProgress) => {
                 const grouped = new Map(); const errors = [];
                 rows.forEach((r, idx) => {
                   const poNumber = String(r['No. PO'] || '').trim();
                   const groupCode = String(r['Grup PO'] || '').trim();
                   const productCode = String(r['Original Code'] || '').trim().toUpperCase();
                   const qty = Number(r['Qty Order']) || 0; const amount = Number(r['Jumlah Nominal']) || 0;
                   if (!poNumber || !groupCode || !productCode || qty <= 0) { errors.push(`Baris ${idx + 2}: No. PO, Grup PO, Original Code, dan Qty Order wajib valid.`); return; }
                   if (!mockRepo.getProducts().some(p => String(p.originalCode || '').trim().toUpperCase() === productCode || String(p.code || '').trim().toUpperCase() === productCode)) { errors.push(`Baris ${idx + 2}: produk ${productCode} tidak ditemukan di Master Produk.`); return; }
                   const actualCode = (mockRepo.getProducts().find(p => String(p.originalCode || '').trim().toUpperCase() === productCode || String(p.code || '').trim().toUpperCase() === productCode) || {}).code;
                   if (!grouped.has(poNumber)) grouped.set(poNumber, { po: { poNumber, groupCode, orderDate: parseDMYtoYMD(r['Tanggal PO']), status: 'OPEN' }, items: [] });
                   grouped.get(poNumber).items.push({ productCode: actualCode, qtyOrder: qty, unitPrice: amount / qty });
                 });
                 let success = 0; let i = 0;
                 for (const [poNumber, pack] of grouped) {
                   reportProgress?.(Math.round(i / Math.max(grouped.size, 1) * 100), `Menyimpan PO ${i + 1} dari ${grouped.size}: ${poNumber}...`);
                   try { await mockRepo.addPO(pack.po, pack.items); success++; }
                   catch (e) { errors.push(`${poNumber}: ${e?.message || String(e)}`); }
                   i++;
                 }
                 reportProgress?.(100, `Selesai: ${success} PO tersimpan, ${errors.length} masalah.`);
                 const message = errors.length
                   ? `Import Purchase Order selesai.\n\nBerhasil: ${success} PO\nGagal/bermasalah: ${errors.length} baris atau PO\n\nDetail: ${errors.slice(0, 3).join(' | ')}`
                   : `Import Purchase Order berhasil!\n\n${success} PO berhasil disimpan.`;
                 return { success, failed: errors.length, closeAfterResult: true, message };
              }} />
          )}
        </div>
      );
    }

    function ExportReportButton({ onExportExcel, onExportPDF }) {
      const [isOpen, setIsOpen] = React.useState(false);
      const dropdownRef = React.useRef(null);

      React.useEffect(() => {
        function handleClickOutside(event) {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const handlePDF = () => {
        setIsOpen(false);
        if (onExportPDF) {
          onExportPDF();
        } else {
          window.print();
        }
      };

      const handleExcel = () => {
        setIsOpen(false);
        if (onExportExcel) onExportExcel();
      };

      return (
        <div className="relative inline-block text-left" ref={dropdownRef}>
          <button
            onClick={() => setIsOpen(!isOpen)}
            className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl flex items-center gap-1.5 shadow-md transition"
          >
            <i data-lucide="download" className="w-3.5 h-3.5"></i>
            Export
            <i data-lucide="chevron-down" className="w-3.5 h-3.5 ml-1"></i>
          </button>

          {isOpen && (
            <div className="origin-top-right absolute right-0 mt-2 w-48 rounded-xl shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50 divide-y divide-slate-100 overflow-hidden">

              onImport={async (rows, reportProgress) => {
                let count = 0; const errors = [];
                for (let i = 0; i < rows.length; i++) {
                  const r = rows[i]; reportProgress?.(Math.round(i / Math.max(rows.length, 1) * 100), `Menyimpan barang baru ${i + 1} dari ${rows.length}...`);
                  try {
                    const itemCode = String(r['Kode item'] || '').trim().toUpperCase();
                    const productName = String(r['Nama Produk'] || '').trim();
                    const brandName = String(r['Merek'] || '').trim();
                    const product = mockRepo.getProducts().find(p => String(p.code || '').trim().toUpperCase() === itemCode);
                    if (!itemCode || !productName) throw new Error('Kode item dan Nama Produk wajib diisi.');
                    if (!product) throw new Error(`Kode Item ${itemCode} belum ada di Master Produk.`);
                    if (brandName) await mockRepo.upsertBrandMapping({ itemCode, productName, brandName });
                    await mockRepo.addDataBarangBaru({ tanggalBeli: parseDMYtoYMD(r['Tanggal Beli']), itemCode, productName: product.name || productName, brandName: brandName || product.brandName || '', qtyAwal: Number(r['Qty Awal beli']) || 0 });
                    count++;
                  } catch (e) { errors.push(`Baris ${i + 2}: ${e?.message || String(e)}`); }
                }
                reportProgress?.(100, `Selesai: ${count} berhasil, ${errors.length} gagal.`);
                const message = errors.length
                  ? `Import Data Barang Baru selesai.\n\nBerhasil: ${count} data\nGagal: ${errors.length} data\n\nDetail kegagalan: ${errors.slice(0, 3).join(' | ')}`
                  : `Import Data Barang Baru berhasil!\n\n${count} data berhasil disimpan.`;
                return { success: count, failed: errors.length, closeAfterResult: true, message };
              }}
            />
          )}

      );

    // 6.1 Laporan Stok per Merek
    function ReportStockPerBrandView() {
      const brands = mockRepo.getBrands();

      const poItems = mockRepo.getPOItems();

        return brands.map((b, idx) => {
          const brandProducts = products.filter(p => p.brandKey === b.code);

          let totalStockVal = 0;

          brandProducts.forEach(p => {

    // 6.2 Laporan Stok Gudang vs Penjualan (Bulanan)
    // No., Merek, Qty Pembelian yang Datang, Penjualan, Stok (All), Nilai Persediaan (Stok All * Harga Beli)
    // Klik merek membuka detail produk dengan format sama
    function ReportStockVsSalesMonthlyView() {
      const brands = mockRepo.getBrands();
      const products = mockRepo.getProducts();
      const receipts = mockRepo.getGoodsReceipts();
      const sales = mockRepo.getSales();
      const masterStocks = mockRepo.getMasterStocks();
      const [selectedMonth, setSelectedMonth] = useState('2026-01');
      const [selectedBrandDetail, setSelectedBrandDetail] = useState(null);

      const [yr, mn] = selectedMonth.split('-');
      const lastDay = new Date(yr, mn, 0).getDate();
      const startDate = `${selectedMonth}-01`;
      const endDate = `${selectedMonth}-${String(lastDay).padStart(2, '0')}`;

      // Hitung stok All per itemCode dari Master Stok
      const getStockAllForItem = (code) => {
        const st = masterStocks.find(s => s.itemCode.toUpperCase() === code.toUpperCase());
        if (!st) return 0;
        return (Number(st.stokEcer) || 0) + (Number(st.stokGrosir) || 0) + (Number(st.stokGudang) || 0);
      };

      const reportData = useMemo(() => {
        return brands.map((b, idx) => {
          const brandProducts = products.filter(p => p.brandKey === b.code);

          let incomingTotal = 0;
          let salesPcsTotal = 0;
          let stockAllTotal = 0;
          let inventoryValueTotal = 0;

          brandProducts.forEach(p => {
            const pReceipts = receipts.filter(r => r.productCode === p.code && isDateInRange(r.receiptDate, startDate, endDate));
            incomingTotal += pReceipts.reduce((s, r) => s + Number(r.qtyReceived), 0);

            const pSales = sales.filter(s => s.productCode === p.code && isDateInRange(s.date, startDate, endDate));
            salesPcsTotal += pSales.reduce((s, sl) => s + Number(sl.qty), 0);

            const pStockAll = getStockAllForItem(p.code);
            stockAllTotal += pStockAll;
            inventoryValueTotal += pStockAll * (Number(p.basePrice) || 0);
          });

          return {
            rowNo: idx + 1,
            brandKey: b.code,
            brandName: b.name,
            incoming: incomingTotal,
            salesPcs: salesPcsTotal,
            stockAll: stockAllTotal,
            inventoryValue: inventoryValueTotal
          };
        });
      }, [brands, products, receipts, sales, masterStocks, selectedMonth]);

      // Data detail produk jika salah satu merek diklik
      const brandDetailProducts = useMemo(() => {
        if (!selectedBrandDetail) return [];
        const brandProds = products.filter(p => p.brandKey === selectedBrandDetail.brandKey);
        return brandProds.map((p, idx) => {
          const pReceipts = receipts.filter(r => r.productCode === p.code && isDateInRange(r.receiptDate, startDate, endDate));
          const pIn = pReceipts.reduce((s, r) => s + Number(r.qtyReceived), 0);

          const pSales = sales.filter(s => s.productCode === p.code && isDateInRange(s.date, startDate, endDate));
          const pSold = pSales.reduce((s, sl) => s + Number(sl.qty), 0);

          const pStockAll = getStockAllForItem(p.code);
          const pInventoryVal = pStockAll * (Number(p.basePrice) || 0);

          return {
            rowNo: idx + 1,
            productCode: p.code,
            productName: p.name,
            incoming: pIn,
            salesPcs: pSold,
            stockAll: pStockAll,
            inventoryValue: pInventoryVal
          };
        });
      }, [selectedBrandDetail, products, receipts, sales, masterStocks, selectedMonth]);

      const handleExportMainExcel = () => {
        const rows = reportData.map(r => ({
          'No.': r.rowNo,
          'Merek': r.brandName,
          'Qty Pembelian yang Datang': r.incoming,
          'Penjualan (pcs)': r.salesPcs,
          'Stok': r.stockAll,
          'Nilai Persediaan': r.inventoryValue
        }));
        exportToExcel(rows, `Laporan_Stok_vs_Penjualan_Bulanan_${selectedMonth}`);
      };

      const handleExportDetailExcel = () => {
        if (!selectedBrandDetail) return;
        const rows = brandDetailProducts.map(r => ({
          'No.': r.rowNo,
          'Kode Item': r.productCode,
          'Nama Produk': r.productName,
          'Qty Pembelian yang Datang': r.incoming,
          'Penjualan (pcs)': r.salesPcs,
          'Stok': r.stockAll,
          'Nilai Persediaan': r.inventoryValue
        }));
        exportToExcel(rows, `Detail_Produk_${selectedBrandDetail.brandName}_${selectedMonth}`);
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
              <div className="flex items-center gap-3">
                <label className="text-xs font-bold text-slate-500 uppercase">Bulan Analisis:</label>
                <input
                  type="month"
                  value={selectedMonth}
                  onChange={e => setSelectedMonth(e.target.value)}
                  className="px-3 py-1.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700"
                />
              </div>

              {selectedBrandDetail ? (
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setSelectedBrandDetail(null)}
                    className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl flex items-center gap-1.5 transition"
                  >
                    <span className="flex shrink-0"><i data-lucide="arrow-left" className="w-3.5 h-3.5"></i></span> Kembali ke Daftar Merek
                  </button>
                  <ExportReportButton onExportExcel={handleExportDetailExcel} />
                </div>
              ) : (
                <ExportReportButton onExportExcel={handleExportMainExcel} />
              )}
            </div>

            {selectedBrandDetail ? (
              <div>
                <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl mb-4 flex items-center justify-between">
                  <div className="text-xs font-semibold text-blue-900">
                    Menampilkan Rincian Produk untuk Merek: <strong className="text-sm font-extrabold">{selectedBrandDetail.brandName}</strong>
                  </div>
                  <span className="text-[11px] text-blue-700 font-medium">{brandDetailProducts.length} Produk Terdaftar</span>
                </div>
                <div className="overflow-x-auto rounded-xl border border-slate-100">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                        <th className="py-3 px-4 text-center w-12">No.</th>
                        <th className="py-3 px-4">Kode Item</th>
                        <th className="py-3 px-4">Nama Produk</th>
                        <th className="py-3 px-4 text-right">Qty Pembelian yang Datang</th>
                        <th className="py-3 px-4 text-right">Penjualan</th>
                        <th className="py-3 px-4 text-right font-bold text-blue-700">Stok</th>
                        <th className="py-3 px-4 text-right">Nilai Persediaan</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {brandDetailProducts.length === 0 ? (
                        <tr><td colSpan="7" className="text-center py-6 text-slate-400">Tidak ada produk untuk merek ini</td></tr>
                      ) : (
                        brandDetailProducts.map(r => (
                          <tr key={r.rowNo} className="hover:bg-slate-50">
                            <td className="py-3 px-4 text-center font-bold text-slate-400">{r.rowNo}</td>
                            <td className="py-3 px-4 font-mono font-bold text-slate-700">{r.productCode}</td>
                            <td className="py-3 px-4 font-medium text-slate-800">{r.productName}</td>
                            <td className="py-3 px-4 text-right text-emerald-600 font-semibold">+{formatNum(r.incoming)}</td>
                            <td className="py-3 px-4 text-right text-amber-600 font-semibold">{formatNum(r.salesPcs)}</td>
                            <td className="py-3 px-4 text-right font-extrabold text-blue-700">{formatNum(r.stockAll)}</td>
                            <td className="py-3 px-4 text-right font-bold text-slate-800">{formatRp(r.inventoryValue)}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            ) : (
              <div>
                <p className="text-xs text-slate-500 mb-3 flex items-center gap-1.5">
                  <span className="flex shrink-0"><i data-lucide="info" className="w-3.5 h-3.5 text-blue-600"></i></span>
                  Klik salah satu baris merek di bawah untuk membuka rincian produk pada merek tersebut.
                </p>
                <div className="overflow-x-auto rounded-xl border border-slate-100">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                        <th className="py-3 px-4 text-center w-12">No.</th>
                        <th className="py-3 px-4">Merek</th>
                        <th className="py-3 px-4 text-right">Qty Pembelian yang Datang</th>
                        <th className="py-3 px-4 text-right">Penjualan</th>
                        <th className="py-3 px-4 text-right font-bold text-blue-700">Stok</th>
                        <th className="py-3 px-4 text-right">Nilai Persediaan</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {reportData.map(r => (
                        <tr
                          key={r.rowNo}
                          onClick={() => setSelectedBrandDetail(r)}
                          className="hover:bg-blue-50/70 cursor-pointer transition group"
                          title="Klik untuk melihat detail produk merek ini"
                        >

                          <td className="py-3 px-4 text-right text-emerald-600 font-semibold">+{formatNum(r.incoming)}</td>

    // 6.3 Laporan Realisasi Retur
    // Kolom: No., Merek, Qty Retur, Nilai Pengajuan, Nilai Realisasi, Sisa Outstanding, Persentase Realisasi
    function ReportReturnRealizationView() {
      const returns = mockRepo.getReturns();
      const returnRealizations = mockRepo.getReturnRealizations();
      const brands = mockRepo.getBrands();

      const [brandFilter, setBrandFilter] = useState('ALL');

      const reportData = useMemo(() => {
        return returns
          .filter(r => brandFilter === 'ALL' || r.brandKey === brandFilter)
          .map((r, idx) => {
            const br = brands.find(b => b.code === r.brandKey);
            const reals = returnRealizations.filter(rl => rl.returnNumber === r.returnNumber);
            const realizedVal = reals.reduce((s, rl) => s + Number(rl.realizedValue), 0);
            const outstanding = Math.max(0, r.submissionValue - realizedVal);
            const pct = r.submissionValue > 0 ? (realizedVal / r.submissionValue) * 100 : 0;

            return {
              rowNo: idx + 1,
              brandName: br ? br.name : r.brandKey,
              qtyReturn: r.qtyReturn,
              submissionValue: r.submissionValue,
              realizedValue: realizedVal,
              outstanding,
              percentage: pct
            };
          });
      }, [returns, returnRealizations, brands, brandFilter]);

      const handleExportExcel = () => {
        const rows = reportData.map(r => ({
          'No.': r.rowNo,
          'Merek': r.brandName,
          'Qty Retur': r.qtyReturn,
          'Nilai Pengajuan': r.submissionValue,
          'Nilai Realisasi': r.realizedValue,
          'Sisa Outstanding': r.outstanding,
          'Persentase Realisasi': `${r.percentage.toFixed(1)}%`
        }));
        exportToExcel(rows, 'Laporan_Realisasi_Retur');
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex justify-between items-center mb-6">
              <div className="flex items-center gap-3">
                <label className="text-xs font-bold text-slate-500 uppercase">Filter Merek:</label>
                <select
                  value={brandFilter}
                  onChange={e => setBrandFilter(e.target.value)}
                  className="px-3 py-1.5 border border-slate-200 rounded-xl text-sm"

    // 7.1 Laporan Barang Tidak Datang
    // No., Grup PO, No. PO, Kode Item Produk, Nama Produk, Qty Order, Qty Tidak Datang
    function ReportUndeliveredGoodsView() {
      const pos = mockRepo.getPOs();
      const poItems = mockRepo.getPOItems();
      const receipts = mockRepo.getGoodsReceipts();
      const products = mockRepo.getProducts();

      const [startDate, setStartDate] = useState('2026-01-01');
      const [endDate, setEndDate] = useState('2026-12-31');
      const [groupFilter, setGroupFilter] = useState('ALL');

      // 1. Saring PO valid berdasarkan rentang tanggal yang dipilih
      const validPOs = useMemo(() => {
        return pos.filter(po => {
          if (po.status !== 'CLOSED' || po.closeReason !== 'SUPPLIER_SHORTAGE') return false;
          return isDateInRange(po.orderDate, startDate, endDate);
        });
      }, [pos, startDate, endDate]);

      // 2. Daftar Grup PO muncul dinamis SESUAI filter tanggal di atas
      const uniqueGroups = useMemo(() => {
        const set = new Set();
        validPOs.forEach(p => { if (p.groupCode) set.add(p.groupCode); });
        return Array.from(set).sort();
      }, [validPOs]);

      // 3. Reset grup jika grup terpilih sebelumnya tidak ada di periode baru
      useEffect(() => {
        if (groupFilter !== 'ALL' && !uniqueGroups.includes(groupFilter)) {
          setGroupFilter('ALL');
        }
      }, [uniqueGroups, groupFilter]);

      const reportRows = useMemo(() => {
        const rows = [];
        let rowIdx = 1;

        validPOs.forEach(po => {
          if (groupFilter !== 'ALL' && po.groupCode !== groupFilter) return;

          const items = poItems.filter(i => i.poNumber === po.poNumber);

          items.forEach(it => {
            const totalReceived = receipts
              .filter(r => r.poNumber === po.poNumber && r.productCode === it.productCode)
              .reduce((sum, r) => sum + Number(r.qtyReceived), 0);

            const qtyShortage = Number(it.qtyOrder) - totalReceived;

            if (qtyShortage > 0) {
              const prd = products.find(p => p.code === it.productCode);
              rows.push({
                rowNo: rowIdx++,
                groupPO: po.groupCode,
                noPO: po.poNumber,
                productCode: it.productCode,
                productName: prd ? prd.name : it.productCode,
                qtyOrder: Number(it.qtyOrder),
                qtyUndelivered: qtyShortage
              });
            }
          });
        });

        return rows;
      }, [validPOs, poItems, receipts, products, groupFilter]);

      const handleExportExcel = () => {
        const rows = reportRows.map(r => ({
          'No.': r.rowNo,
          'Grup PO': r.groupPO,
          'No. PO': r.noPO,
          'Kode Item Produk': r.productCode,
          'Nama Produk': r.productName,
          'Qty Order': r.qtyOrder,
          'Qty Tidak Datang': r.qtyUndelivered
        }));
        exportToExcel(rows, `Laporan_Barang_Tidak_Datang_${startDate}_sd_${endDate}`);
      };

      const handleExportPDF = () => {
        window.print();
      };

      return (
        <div className="space-y-6">
          <div className="soft-card p-6">
            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
              <div className="flex flex-wrap items-center gap-4">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-500 uppercase">Periode PO:</span>
                  <input
                    type="date"
                    value={startDate}
                    onChange={e => setStartDate(e.target.value)}
                    className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500"
                  />
                  <span className="text-xs text-slate-400">s/d</span>
                  <input
                    type="date"
                    value={endDate}
                    onChange={e => setEndDate(e.target.value)}
                    className="px-2.5 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-slate-500 uppercase">Filter Grup PO:</span>
                  <select
                    value={groupFilter}
                    onChange={e => setGroupFilter(e.target.value)}
                    className="px-3 py-1.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="ALL">Semua Grup PO</option>
                    {uniqueGroups.map(grp => (
                      <option key={grp} value={grp}>{grp}</option>
                    ))}
                  </select>
                </div>
              </div>
              <ExportReportButton onExportExcel={handleExportExcel} onExportPDF={handleExportPDF} />
            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-100">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4 text-center w-12">No.</th>
                    <th className="py-3 px-4">Grup PO</th>
